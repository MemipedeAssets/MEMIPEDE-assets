<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMIPEDE Asset Hub</title>

<style>
body{
background:#0f1117;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:30px;
text-align:center;
}

h1{
font-size:48px;
margin-bottom:10px;
}

p{
color:#aaa;
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
max-width:1000px;
margin:auto;
}

.card{
background:#1b1f27;
padding:30px;
border-radius:15px;
text-decoration:none;
color:white;
font-size:22px;
transition:.2s;
}

.card:hover{
background:#2d333d;
transform:translateY(-5px);
}
</style>

</head>

<body>

<h1>🐛 MEMIPEDE Asset Hub</h1>

<p>Official community asset library.</p>

<div class="grid">

<a class="card" href="#">🖼️ Memes</a>

<a class="card" href="#">🎬 Videos</a>

<a class="card" href="#">🎞️ GIFs</a>

<a class="card" href="#">👤 Profile Pictures</a>

<a class="card" href="#">✨ Transparent PNGs</a>

<a class="card" href="#">🎨 Logos</a>

<a class="card" href="#">📱 Twitter Assets</a>

<a class="card" href="#">📦 Download Packs</a>

</div>

</body>
</html>
